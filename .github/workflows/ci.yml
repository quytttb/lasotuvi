name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project and development tools
        run: uv sync --locked --extra dev
      - name: Verify runtime dependency
        run: uv run python -c "from py_iztro import Astro; Astro()"
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Pyright
        run: uv run pyright --pythonpath .venv/bin/python
      - name: Tests
        run: uv run pytest

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project and test tools
        run: uv sync --locked --extra dev
      - name: Tests without coverage artifacts
        run: uv run pytest -o addopts="-q -n auto"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked audit environment
        run: uv sync --locked --all-extras --group audit
      - name: Audit resolved dependencies
        run: uv run --group audit pip-audit
