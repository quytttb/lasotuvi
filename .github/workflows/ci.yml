name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -e ".[dev]"
      - name: Verify runtime dependency
        run: .venv/bin/python -c "from py_iztro import Astro; Astro()"
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Black
        run: .venv/bin/black --check .
      - name: Pyright
        run: .venv/bin/pyright --pythonpath .venv/bin/python
      - name: Tests
        run: .venv/bin/pytest

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test tools
        run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -e ".[dev]"
      - name: Tests without coverage artifacts
        run: .venv/bin/pytest -o addopts="-q -n auto"
