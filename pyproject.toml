[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lasotuvi"
version = "2.0.0"
description = "Mã nguồn mở chương trình an sao lá số tử vi"
authors = [
    {name = "doanguyen", email = "dungnv2410@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "ephem>=4.1.5",
    "py-iztro>=0.1.5,<0.2",
]

[tool.setuptools.packages.find]
include = ["lasotuvi*", "api*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
lasotuvi = ["data/*.json"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-mock>=3.14.0",
    "faker>=30.0.0",
    "freezegun>=1.5.1",
    "ruff>=0.7.0",
    "black>=24.0.0",
    "pyright>=1.1.380",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "degrees: solar-longitude calculations",
    "diaban: earth-plate tests",
    "findnewmoon: astronomical new-moon calculations",
    "findsolarterms: solar-term calculations",
    "integration: tests requiring the py-iztro runtime",
    "justtest: focused legacy regression tests",
    "lich: calendar tests",
    "s2l: solar-to-lunar conversion tests",
    "thienban: heaven-plate tests",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
addopts = [
    "--verbose",
    "--cov=lasotuvi",
    "--cov=api",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-n=auto",  # parallel testing
]

[tool.coverage.run]
source = ["lasotuvi"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
    "demo.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
